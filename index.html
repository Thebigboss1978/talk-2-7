<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlArab 777 P2P Call</title>
<style>
body{margin:0;padding:20px;background:#10141b;color:#eee;font:16px Arial,sans-serif}
main{max-width:440px;margin:auto}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:8px;background:#d5b45b;color:#111;font-weight:bold;font-size:16px}
button:disabled{opacity:.5}
#status{padding:12px;background:#222a35;border-radius:8px;overflow-wrap:anywhere}
#qr{margin:14px auto;width:200px;min-height:0;background:white;text-align:center}
#qr img,#qr canvas{max-width:100%;height:auto}
audio{width:100%;margin:12px 0}
small{color:#aaa;line-height:1.5}
</style>
</head>
<body>
<main>
<h3>AlArab 777 — Voice Call</h3>
<div id="status">Ready</div>

<button id="create">✆ Create Room + QR</button>
<div id="qr"></div>
<button id="join">✆ Join Room</button>
<button id="end" style="background:#333;color:white">End Call</button>

<audio id="audio" autoplay playsinline controls></audio>
<p><small>Create a room on device A. Scan its QR with device B and press Join Room. Allow microphone access on both devices.</small></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const state = {
  peer: null,
  stream: null,
  call: null,
  room: new URL(location.href).searchParams.get("room"),
  qr: null
};

function status(text) {
  $("status").textContent = text;
}

async function microphone() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw Error("Microphone requires HTTPS.");
  }
  if (!state.stream) {
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });
  }
  return state.stream;
}

function newPeer() {
  if (typeof Peer === "undefined") {
    throw Error("PeerJS failed to load. Check your internet connection.");
  }

  return new Promise((resolve, reject) => {
    const peer = new Peer(undefined, {
      host: "0.peerjs.com",
      port: 443,
      path: "/",
      secure: true
    });

    peer.once("open", id => {
      state.peer = peer;
      resolve({ peer, id });
    });

    peer.once("error", error => {
      reject(error);
    });
  });
}

function receive(call) {
  if (state.call) {
    call.close();
    return;
  }

  if (!confirm("Accept incoming voice call?")) {
    call.close();
    return;
  }

  state.call = call;
  call.answer(state.stream);
  attachCall(call);
}

function attachCall(call) {
  call.on("stream", stream => {
    $("audio").srcObject = stream;
    $("audio").play().catch(() => {
      status("Connected. Press Play to hear audio.");
    });
    status("Connected — voice call active.");
  });

  call.on("close", () => {
    $("audio").srcObject = null;
    if (state.call === call) state.call = null;
    status("Call ended.");
  });

  call.on("error", error => {
    status("Call error: " + error.message);
  });
}

async function createRoom() {
  $("create").disabled = true;

  try {
    status("Allow microphone access...");
    await microphone();

    const { peer, id } = await newPeer();
    peer.on("call", receive);

    const url = new URL(location.href);
    url.search = "";
    url.hash = "";
    url.searchParams.set("room", id);

    $("qr").replaceChildren();
    new QRCode($("qr"), {
      text: url.href,
      width: 200,
      height: 200
    });

    state.room = id;
    status("Room ready. Scan QR on device B.");
  } catch (error) {
    status(error.message || "Could not create room.");
  } finally {
    $("create").disabled = false;
  }
}

async function joinRoom() {
  $("join").disabled = true;

  try {
    const room = state.room ||
      new URL(location.href).searchParams.get("room");

    if (!room) throw Error("Scan the room QR code first.");

    status("Allow microphone access...");
    await microphone();

    const { peer } = await newPeer();

    status("Connecting to room...");
    const call = peer.call(room, state.stream);

    if (!call) throw Error("Could not start call.");

    state.call = call;
    attachCall(call);
  } catch (error) {
    status(error.message || "Could not join room.");
  } finally {
    $("join").disabled = false;
  }
}

function endCall() {
  if (state.call) {
    state.call.close();
    state.call = null;
  }

  if (state.peer) {
    state.peer.destroy();
    state.peer = null;
  }

  if (state.stream) {
    state.stream.getTracks().forEach(track => track.stop());
    state.stream = null;
  }

  $("audio").srcObject = null;
  $("qr").replaceChildren();
  status("Call ended.");
}

$("create").addEventListener("click", createRoom);
$("join").addEventListener("click", joinRoom);
$("end").addEventListener("click", endCall);

if (state.room) {
  status("Room link detected. Press Join Room.");
  $("join").style.outline = "2px solid #d5b45b";
}
</script>
</body>
</html>
