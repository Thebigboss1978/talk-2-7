<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكالمة P2P مباشرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            color: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.05em;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e94560;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.6);
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 14px rgba(0, 255, 136, 0.9);
            animation: none;
        }

        .status-dot.calling {
            background: #ffb703;
            box-shadow: 0 0 14px rgba(255, 183, 3, 0.9);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        .status-text {
            font-size: 1.05em;
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.88em;
            color: #94a3b8;
        }

        /* Central Call Controls */
        .call-controls {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .call-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            font-size: 3.8em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .call-btn.start {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            box-shadow: 0 0 35px rgba(0, 217, 255, 0.5);
        }

        .call-btn.start:hover {
            transform: scale(1.08);
            box-shadow: 0 0 55px rgba(0, 217, 255, 0.8);
        }

        .call-btn.calling {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #1a1a2e;
            box-shadow: 0 0 35px rgba(255, 183, 3, 0.6);
            animation: ring 1.2s infinite;
        }

        .call-btn.end {
            background: linear-gradient(135deg, #e94560, #ff4444);
            color: white;
            box-shadow: 0 0 35px rgba(233, 69, 96, 0.6);
            animation: ring 1.5s infinite;
        }

        @keyframes ring {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .call-caption {
            margin-top: 20px;
            font-size: 1.25em;
            font-weight: 800;
            color: #f1f5f9;
        }

        .call-subtext {
            margin-top: 6px;
            font-size: 0.92em;
            color: #94a3b8;
        }

        .call-timer {
            margin-top: 14px;
            font-size: 1.5em;
            font-weight: 800;
            color: #00ff88;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .audio-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 22px;
            height: 36px;
        }

        .bar {
            width: 5px;
            background: #00ff88;
            border-radius: 3px;
            transition: height 0.08s ease;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        /* Incoming Call Box (Ringing Alert) */
        .incoming-card {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.25), rgba(0, 217, 255, 0.2));
            border: 2px solid #00d9ff;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            margin-bottom: 24px;
            animation: alertPulse 1.5s infinite;
            box-shadow: 0 8px 35px rgba(0, 217, 255, 0.35);
        }

        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 217, 255, 0.3); }
            50% { box-shadow: 0 0 45px rgba(0, 217, 255, 0.7); }
        }

        .incoming-bell {
            font-size: 3.2em;
            margin-bottom: 12px;
            display: inline-block;
            animation: ring 0.6s infinite;
        }

        .incoming-title {
            font-size: 1.4em;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .incoming-actions {
            display: flex;
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 1.15em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-success {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 217, 255, 0.6);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e94560, #ff4444);
            color: white;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .share-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #94a3b8;
        }

        .share-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 10px;
            color: #00d9ff;
            font-family: monospace;
            font-size: 0.85em;
            outline: none;
            direction: ltr;
        }

        .error-msg {
            background: rgba(255, 68, 68, 0.15);
            border-right: 4px solid #ff4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            color: #ff8888;
            font-size: 0.95em;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 0.88em;
        }

        @media (max-width: 500px) {
            body { padding: 16px 12px; }
            .call-btn { width: 125px; height: 125px; font-size: 3.2em; }
            .header h1 { font-size: 1.85em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📞 مكالمة P2P مباشرة</h1>
            <p>اتصال واستقبال صوتي فوري ومباشر</p>
        </div>

        <div class="status-bar">
            <div class="status-left">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">جاهز للاتصال</span>
            </div>
            <div class="status-badge" id="otherStatusBadge">
                جاري الفحص...
            </div>
        </div>

        <div id="errorArea"></div>

        <!-- Incoming Call Box (Rings on Callee Device) -->
        <div class="incoming-card hidden" id="incomingCard">
            <div class="incoming-bell">🔔</div>
            <div class="incoming-title">اتصال وارد...</div>
            <div class="incoming-actions">
                <button class="btn btn-success" onclick="answerCall()">📞 إجابة</button>
                <button class="btn btn-danger" onclick="rejectCall()">🔴 رفض</button>
            </div>
        </div>

        <!-- Central Call Controls -->
        <div class="call-controls">
            <button class="call-btn start" id="callBtn" onclick="toggleCall()">📞</button>
            <div class="call-caption" id="callCaption">اضغط للاتصال</div>
            <div class="call-subtext" id="callSubtext">يرن هاتف الجهاز الآخر فوراً بنقرة واحدة</div>
            <div id="callTimer" class="call-timer hidden">00:00</div>
            <div class="audio-indicator" id="audioIndicator"></div>
        </div>

        <!-- Direct Share Link to Open on Second Device -->
        <div class="share-box">
            <span>🔗 رابط الصفحة:</span>
            <input type="text" id="shareInput" readonly value="">
            <button class="btn-secondary" onclick="copyShareLink()">📋 نسخ</button>
            <button class="btn-secondary" onclick="openShareLink()">↗ فتح</button>
        </div>

        <div class="footer">
            workartgroup.com - P2P Voice Call
        </div>
    </div>

    <!-- Hidden audio element for live remote voice playback -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        /* ======================================================================
           PURE UNIVERSAL CALL & RECEIVE ENGINE
           - Zero role selection (No "Party 1" or "Party 2")
           - Press 📞 to Call -> Other device rings with 📞 Answer / 🔴 Reject
           - Complete SDP ICE bundling for guaranteed real audio connection
           ====================================================================== */

        // Generate or retain unique persistent device ID
        const myDeviceId = sessionStorage.getItem('p2p_my_device_id') || ('dev_' + Math.floor(Math.random() * 899999 + 100000));
        sessionStorage.setItem('p2p_my_device_id', myDeviceId);

        // WebRTC & Audio State
        let pc = null;
        let localStream = null;
        let callActive = false;
        let callMode = 'idle'; // 'idle', 'calling', 'ringing', 'connected'
        let pendingIncomingOffer = null;
        let isResetting = false;
        let callDurationSeconds = 0;
        let callTimerInterval = null;

        // UI References
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const otherStatusBadge = document.getElementById('otherStatusBadge');
        const callBtn = document.getElementById('callBtn');
        const callCaption = document.getElementById('callCaption');
        const callSubtext = document.getElementById('callSubtext');
        const callTimer = document.getElementById('callTimer');
        const incomingCard = document.getElementById('incomingCard');
        const remoteAudio = document.getElementById('remoteAudio');
        const shareInput = document.getElementById('shareInput');
        const errorArea = document.getElementById('errorArea');

        // Share Link
        shareInput.value = window.location.href;

        function copyShareLink() {
            shareInput.select();
            document.execCommand('copy');
            showError('✅ تم نسخ الرابط! افتحه على جهازك الآخر للاتصال به.');
        }

        function openShareLink() {
            window.open(window.location.href, '_blank');
        }

        // Web Audio Ringtones & Visualizer
        let audioCtx = null;
        let ringTimer = null;
        let visualizerAnim = null;

        // Local Cross-tab broadcast for instant multi-tab testing
        let broadcast = null;
        try {
            if (window.BroadcastChannel) {
                broadcast = new BroadcastChannel('universal_p2p_calling_bus');
                broadcast.onmessage = (e) => onBroadcastMessage(e.data);
            }
        } catch (_) {}

        // Google STUN servers
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        function updateStatus(text, type = 'idle') {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (type === 'connected') statusDot.classList.add('connected');
            if (type === 'calling') statusDot.classList.add('calling');
        }

        function showError(msg) {
            errorArea.innerHTML = `<div class="error-msg">${msg}</div>`;
            setTimeout(() => { errorArea.innerHTML = ''; }, 6000);
        }

        // --- Microphone Access ---
        async function getAudio() {
            if (localStream) return localStream;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                return localStream;
            } catch (err) {
                showError('❌ يرجى السماح بالوصول للميكروفون: ' + err.message);
                return null;
            }
        }

        // Complete ICE Gathering Helper
        function waitForIceComplete(peerConn) {
            return new Promise((resolve) => {
                if (peerConn.iceGatheringState === 'complete') {
                    resolve();
                    return;
                }
                let timer = null;
                const check = () => {
                    if (peerConn.iceGatheringState === 'complete') {
                        cleanup();
                        resolve();
                    }
                };
                const onCandidate = (e) => {
                    if (!e.candidate) {
                        cleanup();
                        resolve();
                    }
                };
                const cleanup = () => {
                    if (timer) clearTimeout(timer);
                    peerConn.removeEventListener('icecandidate', onCandidate);
                    peerConn.removeEventListener('icegatheringstatechange', check);
                };
                peerConn.addEventListener('icecandidate', onCandidate);
                peerConn.addEventListener('icegatheringstatechange', check);
                timer = setTimeout(() => {
                    cleanup();
                    resolve();
                }, 1200);
            });
        }

        // --- Call Button (Toggle Call / Hangup) ---
        async function toggleCall() {
            if (callMode === 'idle') {
                await startCall();
            } else {
                await hangup();
            }
        }

        // 1. Initiate Call
        async function startCall() {
            const stream = await getAudio();
            if (!stream) return;

            callMode = 'calling';
            updateStatus('🟡 جاري الاتصال...', 'calling');

            callBtn.className = 'call-btn calling';
            callBtn.textContent = '📞';
            callCaption.textContent = 'جاري الرنين...';
            callSubtext.textContent = 'اضغط لإلغاء الاتصال';

            playRingbackTone();

            if (pc) {
                try { pc.close(); } catch (_) {}
            }
            pc = new RTCPeerConnection(rtcConfig);

            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            pc.ontrack = handleOnTrack;
            pc.onconnectionstatechange = handleConnectionStateChange;

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await waitForIceComplete(pc);

            const completeOffer = {
                type: pc.localDescription.type,
                sdp: pc.localDescription.sdp
            };

            try {
                await fetch('/api/signal/p2p_call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        caller: myDeviceId,
                        offer: completeOffer
                    })
                });
            } catch (err) {
                showError('فشل إرسال إشارة الاتصال: ' + err.message);
            }

            if (broadcast) {
                broadcast.postMessage({ type: 'p2p_call', caller: myDeviceId, offer: completeOffer });
            }
        }

        // 2. Incoming Call Trigger
        function onIncomingCall(offer, callerId) {
            if (callMode !== 'idle' || pc || callerId === myDeviceId) return;
            pendingIncomingOffer = offer;
            callMode = 'ringing';

            incomingCard.classList.remove('hidden');
            updateStatus('🔔 اتصال وارد...', 'calling');
            playIncomingRingtone();
        }

        // 3. Answer Incoming Call
        async function answerCall() {
            stopRingtone();
            incomingCard.classList.add('hidden');

            const stream = await getAudio();
            if (!stream) {
                rejectCall();
                return;
            }

            callMode = 'connecting';
            updateStatus('🟡 جاري الربط...', 'calling');

            if (pc) {
                try { pc.close(); } catch (_) {}
            }
            pc = new RTCPeerConnection(rtcConfig);

            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            pc.ontrack = handleOnTrack;
            pc.onconnectionstatechange = handleConnectionStateChange;

            try {
                await pc.setRemoteDescription(new RTCSessionDescription(pendingIncomingOffer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                await waitForIceComplete(pc);

                const completeAnswer = {
                    type: pc.localDescription.type,
                    sdp: pc.localDescription.sdp
                };

                await fetch('/api/signal/p2p_answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer: completeAnswer })
                });

                if (broadcast) {
                    broadcast.postMessage({ type: 'p2p_answer', answer: completeAnswer });
                }

                setConnectedUI();
            } catch (err) {
                showError('فشل الرد على المكالمة: ' + err.message);
                resetCall();
            }
        }

        // 4. Reject Incoming Call
        async function rejectCall() {
            stopRingtone();
            incomingCard.classList.add('hidden');
            await hangup();
        }

        // 5. Caller receives Answer
        async function onAnswerReceived(answer) {
            if (pc && pc.signalingState === 'have-local-offer') {
                stopRingtone();
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    setConnectedUI();
                } catch (err) {
                    showError('خطأ استقبال الرد: ' + err.message);
                }
            }
        }

        // 6. Connected State
        function setConnectedUI() {
            callMode = 'connected';
            callActive = true;
            stopRingtone();

            incomingCard.classList.add('hidden');
            updateStatus('✅ متصل! جاري الاستماع...', 'connected');

            callBtn.className = 'call-btn end';
            callBtn.textContent = '🔴';
            callCaption.textContent = 'إنهاء المكالمة';
            callSubtext.textContent = 'المكالمة متصلة الآن بصوت حقيقي مباشر';

            callTimer.classList.remove('hidden');
            startTimer();
            startVisualizer();
        }

        function handleOnTrack(e) {
            remoteAudio.srcObject = e.streams[0];
            remoteAudio.play().catch(() => {});
            setConnectedUI();
        }

        function handleConnectionStateChange() {
            if (!pc) return;
            if (pc.connectionState === 'connected') {
                setConnectedUI();
            } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                resetCall();
            }
        }

        // 7. Hangup Call
        async function hangup() {
            if (isResetting) return;
            isResetting = true;
            try {
                await fetch('/api/signal/p2p_hangup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });
            } catch (_) {}

            if (broadcast) {
                broadcast.postMessage({ type: 'p2p_hangup' });
            }

            resetCall();
            setTimeout(() => { isResetting = false; }, 800);
        }

        function resetCall() {
            stopRingtone();
            stopTimer();
            stopVisualizer();

            if (pc) {
                try { pc.close(); } catch (_) {}
                pc = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            remoteAudio.srcObject = null;
            callActive = false;
            callMode = 'idle';
            pendingIncomingOffer = null;

            incomingCard.classList.add('hidden');
            callTimer.classList.add('hidden');

            callBtn.className = 'call-btn start';
            callBtn.textContent = '📞';
            callCaption.textContent = 'اضغط للاتصال';
            callSubtext.textContent = 'يرن هاتف الجهاز الآخر فوراً بنقرة واحدة';
            updateStatus('جاهز للاتصال', 'idle');
        }

        // --- Call Timer ---
        function startTimer() {
            stopTimer();
            callDurationSeconds = 0;
            callTimer.textContent = '00:00';
            callTimerInterval = setInterval(() => {
                callDurationSeconds++;
                const mins = String(Math.floor(callDurationSeconds / 60)).padStart(2, '0');
                const secs = String(callDurationSeconds % 60).padStart(2, '0');
                callTimer.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }
        }

        // --- Audio Visualizer ---
        function startVisualizer() {
            stopVisualizer();
            if (!localStream) return;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                const vCtx = new AC();
                const source = vCtx.createMediaStreamSource(localStream);
                const analyser = vCtx.createAnalyser();
                analyser.fftSize = 64;
                source.connect(analyser);

                const container = document.getElementById('audioIndicator');
                container.innerHTML = '';
                for (let i = 0; i < 12; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.height = '4px';
                    container.appendChild(bar);
                }

                const bars = container.querySelectorAll('.bar');
                const data = new Uint8Array(analyser.frequencyBinCount);

                const render = () => {
                    if (callMode !== 'connected') return;
                    analyser.getByteFrequencyData(data);
                    bars.forEach((bar, idx) => {
                        const val = data[idx * 2] || 0;
                        const h = Math.max(4, (val / 255) * 32);
                        bar.style.height = `${h}px`;
                    });
                    visualizerAnim = requestAnimationFrame(render);
                };
                render();
            } catch (_) {}
        }

        function stopVisualizer() {
            if (visualizerAnim) {
                cancelAnimationFrame(visualizerAnim);
                visualizerAnim = null;
            }
            document.getElementById('audioIndicator').innerHTML = '';
        }

        // --- Sound Generator (Pure Web Audio Synthetic Ringtones) ---
        function getAudioContext() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx && AC) audioCtx = new AC();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        function playIncomingRingtone() {
            stopRingtone();
            const ctx = getAudioContext();
            if (!ctx) return;

            const ring = () => {
                try {
                    const t = ctx.currentTime;
                    [0, 0.25].forEach(dt => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(440, t + dt);
                        gain.gain.setValueAtTime(0.001, t + dt);
                        gain.gain.linearRampToValueAtTime(0.3, t + dt + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.18);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t + dt);
                        osc.stop(t + dt + 0.2);
                    });
                } catch (_) {}
            };

            ring();
            ringTimer = setInterval(ring, 1800);
        }

        function playRingbackTone() {
            stopRingtone();
            const ctx = getAudioContext();
            if (!ctx) return;

            const ring = () => {
                try {
                    const t = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.setValueAtTime(425, t);
                    gain.gain.setValueAtTime(0.001, t);
                    gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
                    gain.gain.setValueAtTime(0.15, t + 0.95);
                    gain.gain.linearRampToValueAtTime(0.001, t + 1.0);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 1.0);
                } catch (_) {}
            };

            ring();
            ringTimer = setInterval(ring, 3000);
        }

        function stopRingtone() {
            if (ringTimer) {
                clearInterval(ringTimer);
                ringTimer = null;
            }
        }

        // --- Cross-Tab BroadcastChannel Handler ---
        function onBroadcastMessage(msg) {
            if (!msg) return;
            if (msg.type === 'p2p_call' && msg.caller !== myDeviceId) {
                onIncomingCall(msg.offer, msg.caller);
            } else if (msg.type === 'p2p_answer' && callMode === 'calling') {
                onAnswerReceived(msg.answer);
            } else if (msg.type === 'p2p_hangup') {
                resetCall();
            }
        }

        // --- HTTP Session Synchronizer (Runs every 500ms) ---
        async function syncSession() {
            try {
                const res = await fetch(`/api/signal/p2p_session?device_id=${encodeURIComponent(myDeviceId)}`);
                if (!res.ok) return;
                const data = await res.json();

                // Status of other device
                if (data.otherOnline) {
                    otherStatusBadge.textContent = 'الجهاز الآخر متصل 🟢';
                    otherStatusBadge.style.color = '#00ff88';
                } else {
                    otherStatusBadge.textContent = 'بانتظار فتح الجهاز الآخر ⚪';
                    otherStatusBadge.style.color = '#94a3b8';
                }

                // Check for incoming call
                if (data.callState === 'calling' && data.caller !== myDeviceId && data.offer) {
                    if (callMode === 'idle' && !pc) {
                        onIncomingCall(data.offer, data.caller);
                    }
                }

                // Check for answer on caller side
                if (data.callState === 'connected' && data.caller === myDeviceId && data.answer) {
                    if (callMode === 'calling' && pc && pc.signalingState === 'have-local-offer') {
                        onAnswerReceived(data.answer);
                    }
                }

                // Check for hangup
                if (data.callState === 'idle' && (callActive || callMode === 'calling' || callMode === 'ringing')) {
                    if (!isResetting) {
                        resetCall();
                    }
                }
            } catch (_) {}
        }

        // Initialize
        syncSession();
        setInterval(syncSession, 500);
    </script>
</body>
