<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ محادثة صوتية + مكالمة P2P</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1a1a25;
      --border: #1e1e2e;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #64748b;
      --user: #1e3a5f;
      --ai: #1a1a2e;
      --peer: #2d1f3d;
      --glow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 10;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
    .subtitle { font-size: 11px; color: var(--muted); margin-right: auto; }

    .mode-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      gap: 1px;
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Tajawal', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: rgba(0, 212, 255, 0.15);
      color: var(--accent);
    }

    /* المحادثة */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 5;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 15px;
      animation: fadeIn 0.3s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      background: var(--user);
      border: 1px solid rgba(0, 212, 255, 0.2);
      margin-right: auto;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      background: var(--ai);
      border: 1px solid rgba(124, 58, 237, 0.2);
      margin-left: auto;
      border-bottom-left-radius: 4px;
      text-align: right;
    }

    .msg.peer {
      background: var(--peer);
      border: 1px solid rgba(236, 72, 153, 0.2);
      margin-left: auto;
      border-bottom-left-radius: 4px;
      text-align: right;
    }

    .msg .label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* منطقة التحكم */
    .controls {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 10;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(20px);
    }

    #status-text {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
      transition: color 0.3s;
    }

    /* الزر الكبير */
    #mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      position: relative;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mic-btn:hover { transform: scale(1.05); }

    #mic-btn.listening {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      animation: ripple 1s infinite;
      box-shadow: 0 0 30px rgba(220, 38, 38, 0.5);
    }

    #mic-btn.speaking {
      background: linear-gradient(135deg, #059669, #10b981);
      animation: speakPulse 0.8s infinite alternate;
    }

    #mic-btn.connected {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      animation: ripple 1.5s infinite;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
    }

    @keyframes ripple {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
      100% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
    }

    @keyframes speakPulse {
      from { transform: scale(1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
      to { transform: scale(1.08); box-shadow: 0 0 40px rgba(16, 185, 129, 0.7); }
    }

    #mic-btn svg { width: 28px; height: 28px; fill: white; }

    /* موجة صوتية */
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .wave-bars.active { opacity: 1; }

    .wave-bars span {
      width: 3px;
      background: var(--accent);
      border-radius: 4px;
      animation: wave 1s infinite ease-in-out;
      height: 6px;
    }

    .wave-bars span:nth-child(1) { animation-delay: 0s; }
    .wave-bars span:nth-child(2) { animation-delay: 0.1s; }
    .wave-bars span:nth-child(3) { animation-delay: 0.2s; }
    .wave-bars span:nth-child(4) { animation-delay: 0.3s; }
    .wave-bars span:nth-child(5) { animation-delay: 0.4s; }
    .wave-bars span:nth-child(6) { animation-delay: 0.3s; }
    .wave-bars span:nth-child(7) { animation-delay: 0.2s; }

    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .small-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 12px;
      transition: all 0.2s;
    }

    .small-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* P2P Panel */
    .p2p-panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 0 20px 16px;
      display: none;
    }

    .p2p-panel.active { display: block; }

    .p2p-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .p2p-grid { grid-template-columns: 1fr; }
    }

    .p2p-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .p2p-box h4 {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .code-area {
      width: 100%;
      min-height: 80px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 8px;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      resize: vertical;
      outline: none;
      margin-bottom: 8px;
    }

    .p2p-actions {
      display: flex;
      gap: 6px;
    }

    .p2p-actions .small-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 11px;
    }

    /* رسالة الترحيب */
    .welcome {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }

    .welcome h2 {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .welcome p { font-size: 14px; }

    /* Peer audio indicator */
    .peer-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .peer-indicator.active { opacity: 1; }

    .peer-bar {
      width: 3px;
      background: #ec4899;
      border-radius: 2px;
      transition: height 0.1s;
    }

    .chrome-note {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <header>
    <div class="status-dot" id="conn-dot"></div>
    <h1>🎙️ محادثة صوتية</h1>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('ai')" id="btn-ai">🤖 AI</button>
      <button class="mode-btn" onclick="setMode('p2p')" id="btn-p2p">📞 P2P</button>
    </div>
    <span class="subtitle" id="model-status">يتحقق...</span>
  </header>

  <!-- P2P Panel -->
  <div class="p2p-panel" id="p2pPanel">
    <div class="p2p-grid">
      <div class="p2p-box">
        <h4>📤 كود العرض (Offer)</h4>
        <textarea class="code-area" id="offerBox" placeholder="اضغط الزر لتوليد Offer..."></textarea>
        <div class="p2p-actions">
          <button class="small-btn" onclick="copyOffer()">📋 نسخ</button>
          <button class="small-btn" onclick="generateOffer()" style="color: var(--accent);">🚀 توليد</button>
        </div>
      </div>
      <div class="p2p-box">
        <h4>📥 كود الرد (Answer)</h4>
        <textarea class="code-area" id="answerBox" placeholder="الصق Answer هنا..."></textarea>
        <div class="p2p-actions">
          <button class="small-btn" onclick="pasteAnswer()">📋 لصق</button>
          <button class="small-btn" onclick="connectWithAnswer()" style="color: #10b981;">🔗 اتصل</button>
        </div>
      </div>
    </div>
    <div style="margin-top: 12px; text-align: center;">
      <button class="small-btn" onclick="receiveRemoteOffer()" style="color: #ec4899;">
        🌐 استقبال عرض من جهاز آخر
      </button>
      <div id="remoteAnswerContainer" style="margin-top: 8px;"></div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat">
    <div class="welcome">
      <h2>اتكلم معايا</h2>
      <p>اضغط الزر واتكلم - AI محلي أو مكالمة P2P 🔒</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="wave-bars" id="waves">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="peer-indicator" id="peerWaves">
      <span class="peer-bar"></span><span class="peer-bar"></span><span class="peer-bar"></span>
      <span class="peer-bar"></span><span class="peer-bar"></span>
    </div>
    <div id="status-text">اضغط للبدء</div>
    <div class="btn-row">
      <button class="small-btn" onclick="stopSpeaking()">⏹ وقف</button>
      <button id="mic-btn" onclick="toggleAction()">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm-1 13.93A7.001 7.001 0 0 1 5 8H3a9 9 0 0 0 8 8.94V19H8v2h8v-2h-3v-2.07A9 9 0 0 0 21 8h-2a7 7 0 0 1-6 6.93z"/></svg>
      </button>
      <button class="small-btn" onclick="clearChat()">🗑 مسح</button>
    </div>
    <div class="chrome-note">افتح في Safari أو Chrome محلياً</div>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    // ── Config ─────────────────────────────────────────
    const BRAIN = "http://localhost:7777";
    let currentMode = 'ai';
    let recognition = null;
    let isListening = false;
    let currentUtterance = null;
    let history = [];
    let synth = window.speechSynthesis;

    // P2P State
    let pc = null;
    let localStream = null;
    let isP2PConnected = false;
    let isInitiator = false;

    // ── Mode Switching ─────────────────────────────────
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('btn-p2p').classList.toggle('active', mode === 'p2p');
      document.getElementById('p2pPanel').classList.toggle('active', mode === 'p2p');
      
      if (mode === 'p2p') {
        setStatus('📞 وضع المكالمة - اضغط توليد Offer', 'idle');
      } else {
        setStatus('اضغط للتكلم مع AI', 'idle');
        if (isP2PConnected) endP2PCall();
      }
    }

    function toggleAction() {
      if (currentMode === 'ai') {
        toggleListen();
      } else {
        if (isP2PConnected) {
          endP2PCall();
        } else if (!document.getElementById('offerBox').value) {
          generateOffer();
        } else if (!document.getElementById('answerBox').value) {
          setStatus('الصق Answer أو استقبل عرض', 'error');
        } else {
          connectWithAnswer();
        }
      }
    }

    // ── P2P WebRTC ─────────────────────────────────────
    async function initPC() {
      pc = new RTCPeerConnection({ iceServers: [] });

      pc.ontrack = (e) => {
        document.getElementById('remoteAudio').srcObject = e.streams[0];
        isP2PConnected = true;
        document.getElementById('mic-btn').classList.add('connected');
        setStatus('✅ متصل P2P! جاري الاستماع...', 'speaking');
        visualizePeerAudio(e.streams[0]);
        addMessage('📞 تم الاتصال بالجهاز الآخر', 'peer');
      };

      pc.onicecandidate = (e) => {
        if (!e.candidate) {
          const sdp = JSON.stringify(pc.localDescription);
          if (isInitiator) {
            document.getElementById('offerBox').value = sdp;
            setStatus('✅ Offer جاهز - انسخه وأرسله', 'idle');
          } else {
            const container = document.getElementById('remoteAnswerContainer');
            container.innerHTML = `
              <textarea class="code-area" id="generatedAnswer" readonly style="min-height:60px;">${sdp}</textarea>
              <button class="small-btn" onclick="copyGeneratedAnswer()">📋 نسخ الرد</button>
            `;
            setStatus('✅ Answer جاهز - انسخه وأرسله', 'idle');
          }
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
          setStatus('❌ انقطع الاتصال', 'error');
          endP2PCall();
        }
      };
    }

    async function getAudioStream() {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        setStatus('لا يمكن الوصول للميكروفون', 'error');
        return null;
      }
    }

    async function generateOffer() {
      const stream = await getAudioStream();
      if (!stream) return;

      isInitiator = true;
      await initPC();
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      localStream = stream;

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      setStatus('🟡 جاري توليد Offer...', 'thinking');
    }

    async function connectWithAnswer() {
      const text = document.getElementById('answerBox').value.trim();
      if (!text) { setStatus('الصق Answer أولاً!', 'error'); return; }

      try {
        const answer = JSON.parse(text);
        await pc.setRemoteDescription(answer);
        setStatus('🟡 جاري الاتصال...', 'thinking');
      } catch (err) {
        setStatus('كود Answer غير صالح', 'error');
      }
    }

    async function receiveRemoteOffer() {
      const offerText = prompt('الصق كود Offer من الجهاز الآخر:');
      if (!offerText) return;

      const stream = await getAudioStream();
      if (!stream) return;

      isInitiator = false;
      await initPC();

      try {
        const offer = JSON.parse(offerText);
        await pc.setRemoteDescription(offer);
        stream.getTracks().forEach(t => pc.addTrack(t, stream));
        localStream = stream;

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        setStatus('🟡 جاري توليد Answer...', 'thinking');
      } catch (err) {
        setStatus('كود Offer غير صالح', 'error');
      }
    }

    function copyOffer() {
      const box = document.getElementById('offerBox');
      if (!box.value) { setStatus('لا يوجد Offer', 'error'); return; }
      box.select(); document.execCommand('copy');
      setStatus('✅ تم نسخ Offer', 'idle');
    }

    function copyGeneratedAnswer() {
      const box = document.getElementById('generatedAnswer');
      if (box) { box.select(); document.execCommand('copy'); setStatus('✅ تم نسخ Answer', 'idle'); }
    }

    async function pasteAnswer() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('answerBox').value = text;
      } catch { setStatus('اضغط Ctrl+V للصق', 'error'); }
    }

    function endP2PCall() {
      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('offerBox').value = '';
      document.getElementById('answerBox').value = '';
      document.getElementById('remoteAnswerContainer').innerHTML = '';
      document.getElementById('mic-btn').classList.remove('connected');
      document.getElementById('peerWaves').classList.remove('active');
      isP2PConnected = false;
      isInitiator = false;
      setStatus('📞 انتهت المكالمة', 'idle');
    }

    function visualizePeerAudio(stream) {
      const ctx = new AudioContext();
      const source = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 32;
      source.connect(analyser);

      const bars = document.querySelectorAll('.peer-bar');
      document.getElementById('peerWaves').classList.add('active');

      function draw() {
        if (!isP2PConnected) return;
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        bars.forEach((bar, i) => {
          const h = (data[i] / 255) * 20;
          bar.style.height = Math.max(3, h) + 'px';
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    // ── AI Speech Recognition ──────────────────────────
    function initRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { setStatus("⚠️ افتح في Safari أو Chrome", "error"); return null; }

      const r = new SpeechRecognition();
      r.continuous = false;
      r.interimResults = true;
      r.lang = 'ar-SA';
      r.maxAlternatives = 1;

      r.onstart = () => {
        setListeningState(true);
        setStatus("🔴 بسمعك...", "listening");
        document.getElementById('waves').classList.add('active');
      };

      r.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        if (e.results[e.results.length - 1].isFinal) {
          handleUserSpeech(transcript);
        } else {
          setStatus(`"${transcript}"`, "listening");
        }
      };

      r.onerror = (e) => {
        if (e.error !== 'no-speech') setStatus(`خطأ: ${e.error}`, "error");
        setListeningState(false);
      };

      r.onend = () => {
        setListeningState(false);
        document.getElementById('waves').classList.remove('active');
      };

      return r;
    }

    function toggleListen() {
      stopSpeaking();
      if (isListening) { recognition?.stop(); return; }
      recognition = initRecognition();
      if (recognition) recognition.start();
    }

    function setListeningState(state) {
      isListening = state;
      const btn = document.getElementById('mic-btn');
      if (state) { btn.classList.add('listening'); btn.classList.remove('speaking'); }
      else { btn.classList.remove('listening'); if (!currentUtterance) setStatus("اضغط للتكلم", "idle"); }
    }

    // ── AI Processing ──────────────────────────────────
    async function handleUserSpeech(text) {
      if (!text.trim()) return;
      addMessage(text, 'user');
      setStatus("🤔 يفكر...", "thinking");

      history.push({ role: 'user', text });
      const ctx = history.slice(-8).map(m => `${m.role === 'user' ? 'إنسان' : 'مساعد'}: ${m.text}`).join('\n');
      const prompt = `أنت مساعد ذكي ودود. رد بجملة أو جملتين بالعربية بشكل طبيعي ومباشر.\n\n${ctx}\nمساعد:`;

      const aiId = 'ai-' + Date.now();
      addMessage('', 'ai', aiId);
      let fullReply = '';

      try {
        const resp = await fetch(BRAIN + '/v1/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'llama3.2:latest', input: prompt, stream: true })
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const lines = decoder.decode(value).split('\n').filter(Boolean);
          for (const line of lines) {
            const clean = line.startsWith('data:') ? line.slice(5).trim() : line;
            if (clean === '[DONE]') continue;
            try {
              const chunk = JSON.parse(clean);
              const delta = (chunk.type === 'response.output_text.delta' && chunk.delta) || (chunk.response && chunk.response.output_text) || '';
              if (delta) { fullReply += delta; document.getElementById(aiId).querySelector('.content').textContent = fullReply; scrollChat(); }
            } catch (e) { }
          }
        }
      } catch (e) {
        fullReply = "عذراً، تأكد إن BRAIN شغال.";
        document.getElementById(aiId).querySelector('.content').textContent = fullReply;
      }

      if (!fullReply.trim()) { fullReply = "ما فهمت، جرب تاني."; document.getElementById(aiId).querySelector('.content').textContent = fullReply; }
      history.push({ role: 'ai', text: fullReply });
      speakText(fullReply);
    }

    // ── TTS ────────────────────────────────────────────
    function speakText(text) {
      stopSpeaking();
      const clean = text.replace(/[*#`]/g, '').trim();
      if (!clean) return;

      const utt = new SpeechSynthesisUtterance(clean);
      const voices = synth.getVoices();
      const arVoice = voices.find(v => v.lang.startsWith('ar'));
      if (arVoice) utt.voice = arVoice;
      utt.rate = 1.1; utt.pitch = 1; utt.lang = 'ar-SA';

      utt.onstart = () => { currentUtterance = utt; document.getElementById('mic-btn').classList.add('speaking'); setStatus("🔊 يتكلم...", "speaking"); };
      utt.onend = () => { currentUtterance = null; document.getElementById('mic-btn').classList.remove('speaking'); setStatus("اضغط للرد", "idle"); };
      synth.speak(utt);
    }

    function stopSpeaking() { synth.cancel(); currentUtterance = null; document.getElementById('mic-btn').classList.remove('speaking'); }

    // ── UI Helpers ─────────────────────────────────────
    function addMessage(text, role, id) {
      const chat = document.getElementById('chat');
      const welcome = chat.querySelector('.welcome');
      if (welcome) welcome.remove();

      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (id) div.id = id;

      const labels = { user: '🎙️ أنت', ai: '🤖 المساعد', peer: '📞 طرف آخر' };
      div.innerHTML = `<div class="label">${labels[role]}</div><div class="content">${text || '<span class="typing-dots"><span></span><span></span><span></span></span>'}</div>`;

      chat.appendChild(div);
      scrollChat();
      return div;
    }

    function scrollChat() { document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight; }

    function setStatus(msg, type) {
      const el = document.getElementById('status-text');
      el.textContent = msg;
      el.style.color = { listening: '#ef4444', thinking: '#f59e0b', speaking: '#10b981', error: '#ef4444', idle: '#64748b' }[type] || '#64748b';
    }

    function clearChat() {
      stopSpeaking();
      history = [];
      document.getElementById('chat').innerHTML = `<div class="welcome"><h2>اتكلم معايا</h2><p>اضغط الزر واتكلم 🎙️</p></div>`;
    }

    // ── Init ───────────────────────────────────────────
    window.onload = () => {
      checkBRAIN();
      if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => synth.getVoices();
      synth.getVoices();
    };

    async function checkBRAIN() {
      try {
        const r = await fetch(BRAIN + "/v1/responses");
        if (r.ok) {
          document.getElementById('conn-dot').style.cssText = "background:#22c55e;box-shadow:0 0 8px #22c55e";
          document.getElementById('model-status').textContent = "✅ متصل";
        } else {
          document.getElementById('model-status').textContent = "❌ BRAIN مش شغال";
        }
      } catch (e) {
        document.getElementById('model-status').textContent = "❌ BRAIN مش شغال";
      }
    }
  </script>
</body>
